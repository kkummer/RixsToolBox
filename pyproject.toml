[build-system]
requires = ["setuptools>=61.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RixsToolBox"
description = "Data analysis software for data collected at the ESRF ID32"
authors = [{ name = "Kurt Kummer", email = "kurt.kummer@esrf.fr" }]
license = { text = "MIT" }
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.8"
dependencies = ["silx", "PyMca5", "scipy"]
dynamic = ["version"]

[project.scripts]
rixstoolbox = "RixsToolBox.RixsToolBox:main"

[tool.setuptools.dynamic]
version = { attr = "RixsToolBox.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py38"
# Exclude files imported from PyMca. It would be easier to update them later if needed.
exclude = ["package/*.py", "build-cxfreeze.py", "build-pyinstaller.py"]

[tool.ruff.isort]

[tool.ruff.lint]
ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
    "D203", # 1 blank line required before class docstring
    "D205", # 1 blank line required between summary line and description
    "D212", # Multi-line docstring summary should start at the first line
    "D400", # First line should end with a period 
    "D415", # First line should end with a period, question mark, or exclamation point
]
select = [
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "NPY", # NumPy-specific rules 
    "PL",  # Pylint
    "RUF", # Ruff
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
